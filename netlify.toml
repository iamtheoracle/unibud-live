# UNIBUD — Netlify (TanStack Start + Nitro SSR)
# Server secrets (set in Netlify UI, never commit):
#   DATABASE_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL,
#   XAI_API_KEY or OPENAI_API_KEY, optional GROK_AUTH_* / Google OAuth
#
# Production must set VITE_AUTH_ENABLED=true in the Netlify UI when real
# multi-user auth is provisioned. Do not force auth off here.

[build]
  command = "npm install --legacy-peer-deps --include=dev && npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_CONFIG_LEGACY_PEER_DEPS = "true"
  NPM_CONFIG_PRODUCTION = "false"
  NODE_OPTIONS = "--max-old-space-size=4096"

[context.production.environment]
  NODE_VERSION = "22"
