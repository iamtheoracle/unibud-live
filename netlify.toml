# UNIBUD — Netlify (TanStack Start + Nitro SSR)
# Server secrets (set in Netlify UI, never commit): OPENAI_API_KEY, XAI_API_KEY, DATABASE_URL

[build]
  # Disable Corepack before install; use lockfile-verified npm ci.
  command = "command -v corepack >/dev/null && corepack disable || true; npm ci --legacy-peer-deps && npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
  NPM_CONFIG_LEGACY_PEER_DEPS = "true"
  NODE_OPTIONS = "--max-old-space-size=4096"
  NETLIFY_COREPACK_ENABLED = "false"
  VITE_AUTH_ENABLED = "false"

[context.production.environment]
  VITE_AUTH_ENABLED = "false"

[context.deploy-preview.environment]
  VITE_AUTH_ENABLED = "false"

[context.branch-deploy.environment]
  VITE_AUTH_ENABLED = "false"
