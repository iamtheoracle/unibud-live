# UNIBUD — Netlify (TanStack Start + Nitro SSR)
# Server secrets (set in Netlify UI, never commit):
#   DATABASE_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL (public site origin),
#   OPENAI_API_KEY and/or XAI_API_KEY

[build]
  # Disable Corepack before install; use lockfile-verified npm ci.
  command = "command -v corepack >/dev/null && corepack disable || true; npm ci --legacy-peer-deps && npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
  NPM_CONFIG_LEGACY_PEER_DEPS = "true"
  NODE_OPTIONS = "--max-old-space-size=4096"
  NETLIFY_COREPACK_ENABLED = "false"
  VITE_AUTH_ENABLED = "false"

# Production: auth enabled for public social use. Configure secrets in Netlify UI.
[context.production.environment]
  VITE_AUTH_ENABLED = "true"
