# Netlify build configuration for UNIBUD (TanStack Start + Nitro).
#
# REQUIRED production env vars (set in Netlify UI — never commit):
#   DATABASE_URL or NETLIFY_DB_URL
#   BETTER_AUTH_SECRET / BETTER_AUTH_URL (when auth is enabled)
# Optional AI (server-only):
#   OPENAI_API_KEY / XAI_API_KEY
#
# PGlite is development-only and is refused when NETLIFY is set.

[build]
  command = "npm install --legacy-peer-deps && npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_AUTH_ENABLED = "false"

[context.production]
  command = "npm install --legacy-peer-deps && npx vite build"
  publish = "dist"
  environment = { NODE_VERSION = "22", NODE_ENV = "production", VITE_AUTH_ENABLED = "false" }

[context.deploy-preview]
  command = "npm install --legacy-peer-deps && npx vite build"
  publish = "dist"
  environment = { NODE_VERSION = "22", NODE_ENV = "production", VITE_AUTH_ENABLED = "false" }
