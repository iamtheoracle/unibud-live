# UNIBUD — Netlify (TanStack Start + Nitro SSR)
# Server secrets (set in Netlify UI, never commit): OPENAI_API_KEY, XAI_API_KEY, DATABASE_URL

[build]
  # Include devDependencies (nitro, vite plugins) — required for TanStack Start build.
  # Match the verified GitHub build and install build-time tools explicitly.
  # Keep npm install until package-lock.json is regenerated and verified for npm ci.
  command = "npm install --legacy-peer-deps --include=dev --no-audit --no-fund && npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_AUTH_ENABLED = "false"
  NPM_CONFIG_LEGACY_PEER_DEPS = "true"
  NPM_CONFIG_PRODUCTION = "false"
  NODE_OPTIONS = "--max-old-space-size=4096"

# Runtime only — do not force NODE_ENV=production during npm install (omits devDeps).
[context.production.environment]
  VITE_AUTH_ENABLED = "false"
