# UNIBUD — Netlify (TanStack Start + Nitro SSR)
# Required secrets in Netlify UI (never commit):
#   DATABASE_URL
#   BETTER_AUTH_SECRET
#   BETTER_AUTH_URL = exact site origin (e.g. https://university-buddy.netlify.app
#                   or the deploy-preview origin when testing previews)
#   Optional OAuth broker: GROK_AUTH_ISSUER, GROK_AUTH_CLIENT_ID, GROK_AUTH_CLIENT_SECRET
#   AI: OPENAI_API_KEY and/or XAI_API_KEY

[build]
  command = "command -v corepack >/dev/null && corepack disable || true; npm ci --legacy-peer-deps && npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "10.8.2"
  NPM_FLAGS = "--legacy-peer-deps"
  NPM_CONFIG_LEGACY_PEER_DEPS = "true"
  NODE_OPTIONS = "--max-old-space-size=4096"
  NETLIFY_COREPACK_ENABLED = "false"
  # Project has the Next.js runtime plugin attached from the Netlify UI; this is a TanStack Start app
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  VITE_AUTH_ENABLED = "true"

[context.production.environment]
  VITE_AUTH_ENABLED = "true"
[context.deploy-preview.environment]
  VITE_AUTH_ENABLED = "true"
[context.branch-deploy.environment]
  VITE_AUTH_ENABLED = "true"
