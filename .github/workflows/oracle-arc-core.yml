name: Oracle Arc Core Verification
on:
  push:
    branches: [main, 'feat/oracle-arc-local-core']
    paths:
      - 'services/oracle-arc-core/**'
      - 'src/lib/bud/**'
      - 'src/lib/agents/**'
      - 'package.json'
      - 'package-lock.json'
      - '.env.example'
      - '.github/workflows/oracle-arc-core.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/oracle-arc-core/**'
      - 'src/lib/bud/**'
      - 'src/lib/agents/**'
      - 'package.json'
      - 'package-lock.json'
      - '.env.example'
      - '.github/workflows/oracle-arc-core.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/oracle-arc-core/requirements.txt
      - name: Test Oracle Arc service
        working-directory: services/oracle-arc-core
        run: |
          pip install -r requirements.txt
          pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install platform dependencies
        run: npm ci
      - name: Typecheck platform integration
        run: npm run typecheck
      - name: Test Oracle Arc provider isolation
        run: node --experimental-strip-types --test src/lib/bud/provider.test.ts
