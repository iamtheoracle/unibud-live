name: Oracle Arc Core Verification
on:
  push:
    branches: [main, 'feat/oracle-arc-local-core']
    paths:
      - 'services/oracle-arc-core/**'
      - '.github/workflows/oracle-arc-core.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/oracle-arc-core/**'
      - '.github/workflows/oracle-arc-core.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/oracle-arc-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/oracle-arc-core/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
