name: Oracle Arc Core Verification
on:
  push:
    branches: [main, 'feat/oracle-arc-local-core']
    paths:
      - 'services/oracle-arc-core/**'
      - 'src/lib/bud/**'
      - 'src/lib/agents/**'
      - 'package.json'
      - 'package-lock.json'
      - '.env.example'
      - '.github/workflows/oracle-arc-core.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/oracle-arc-core/**'
      - 'src/lib/bud/**'
      - 'src/lib/agents/**'
      - 'package.json'
      - 'package-lock.json'
      - '.env.example'
      - '.github/workflows/oracle-arc-core.yml'
permissions:
  contents: read
jobs:
  service-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/oracle-arc-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/oracle-arc-core/requirements.txt
      - name: Install service test dependencies
        run: pip install -r requirements.txt
      - name: Test Oracle Arc service
        run: pytest -q
  provider-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Oracle Arc provider routing and owner isolation
        run: node --experimental-strip-types --test src/lib/bud/provider.test.ts
