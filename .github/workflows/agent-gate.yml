name: Agent Completion Gate

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/agents/**'
      - 'src/lib/spark/**'
      - 'docs/AGENT_COMPLETION_GATE.md'
      - 'package.json'
      - '.github/workflows/agent-gate.yml'
  pull_request:
    paths:
      - 'src/lib/agents/**'
      - 'src/lib/spark/**'
      - 'docs/AGENT_COMPLETION_GATE.md'
      - 'package.json'
      - '.github/workflows/agent-gate.yml'

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run test:agents
