name: Agent Completion Gate

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/agents/**'
      - 'src/lib/spark/**'
      - 'docs/AGENT_COMPLETION_GATE.md'
      - '.github/workflows/agent-gate.yml'
  pull_request:
    paths:
      - 'src/lib/agents/**'
      - 'src/lib/spark/**'
      - 'docs/AGENT_COMPLETION_GATE.md'
      - '.github/workflows/agent-gate.yml'

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types --experimental-specifier-resolution=node --test src/lib/agents/organization.test.ts src/lib/agents/response-policy.test.ts src/lib/agents/runtime.test.ts src/lib/agents/content-context.test.ts src/lib/agents/context-access.test.ts src/lib/spark/runtime.test.ts
