name: Repair lockfile
on:
  workflow_dispatch:
  push:
    branches: ["fix/guest-access-enforcement-2026-10-13"]
    paths:
      - "package.json"
      - ".github/workflows/repair-lockfile.yml"
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guest-access-enforcement-2026-10-13
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Fix postsForLane RankContext shape
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          p = Path("src/routes/_app/index.tsx")
          t = p.read_text()
          # Correct call: ctx without connections; connections as 4th arg
          t = t.replace(
              "postsForLane(merged, lane, { following, connections, interests, likeCounts }, connections)",
              "postsForLane(merged, lane, { following, interests, likeCounts }, connections)",
          )
          t = t.replace(
              "postsForLane(merged, lane, { following, connections, interests, likeCounts })",
              "postsForLane(merged, lane, { following, interests, likeCounts }, connections)",
          )
          p.write_text(t)
          assert "postsForLane(merged, lane, { following, interests, likeCounts }, connections)" in t
          print("ok")
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_app/index.tsx
          if git diff --cached --quiet; then echo No changes; exit 0; fi
          git commit -m "fix: postsForLane RankContext excludes connections"
          git push origin HEAD:fix/guest-access-enforcement-2026-10-13
