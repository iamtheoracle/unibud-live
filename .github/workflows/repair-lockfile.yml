name: Repair lockfile
on:
  workflow_dispatch:
  push:
    branches: ["fix/guest-access-enforcement-2026-10-13"]
    paths:
      - "package.json"
      - ".github/workflows/repair-lockfile.yml"
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guest-access-enforcement-2026-10-13
          fetch-depth: 0
      - name: Fix RankContext object
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          p = Path("src/routes/_app/index.tsx")
          t = p.read_text()
          old = "postsForLane(merged, lane, { following, interests, likeCounts }, connections)"
          new = "postsForLane(merged, lane, { following, interests, likeCounts, universityId: \"\", searches: [] }, connections)"
          if old in t:
              t = t.replace(old, new)
          else:
              t = t.replace(
                  "postsForLane(merged, lane, { following, connections, interests, likeCounts }, connections)",
                  new,
              )
          p.write_text(t)
          assert "universityId" in t and "searches: []" in t
          print("ok")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_app/index.tsx
          if git diff --cached --quiet; then echo No changes; exit 0; fi
          git commit -m "fix: RankContext includes universityId and searches"
          git push origin HEAD:fix/guest-access-enforcement-2026-10-13
