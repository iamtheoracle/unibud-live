name: Repair dependency lockfile
# Triggered by an explicit tagged commit on the approved development branch.

on:
  push:
    branches:
      - approved/guild-entry-point

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: contains(github.event.head_commit.message, '[lockfile-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout approved branch
        uses: actions/checkout@v4
        with:
          ref: approved/guild-entry-point
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify lockfile consistency
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already consistent; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: regenerate npm lockfile [lockfile-repair-result]"
          git push origin HEAD:approved/guild-entry-point
