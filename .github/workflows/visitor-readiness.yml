name: Visitor Readiness Verification
on:
  push:
    branches: [implementation/visitor-readiness-orbit]
  pull_request:
    branches: [implementation/whole-product-foundation]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unibud
          POSTGRES_PASSWORD: unibud_test
          POSTGRES_DB: unibud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unibud -d unibud_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build and apply migrations to disposable PostgreSQL
        env:
          DATABASE_URL: postgres://unibud:unibud_test@localhost:5432/unibud_test
        run: npm run build
      - run: npm run typecheck
      - run: npm run test:academic
      - run: npm run test:auth-policy
      - run: npm run test:media
