name: UNIBUD Pre-UI Verification Gate
# Full application verification gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Show toolchain
        run: |
          node -v
          npm -v
          test -f package-lock.json
          test -f package.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint agent and integration layer (pre-UI gate)
        run: npx eslint src/lib/agents src/lib/spark src/lib/bud/server.ts src/lib/bud/guest-ask.ts src/lib/bud/spark.ts

      - name: Agent and Spark tests (pre-UI gate)
        run: npm run test:agents
