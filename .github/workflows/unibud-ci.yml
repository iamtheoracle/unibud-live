name: UNIBUD Pre-UI Verification Gate
# Run reproducible source checks before a change can be considered ready.

on:
  push:
    branches: [main, rebuild/unibud-mini-apps-2026-10-16, architecture/unibud-next-era-foundation]
  pull_request:
    branches: [main, rebuild/unibud-mini-apps-2026-10-16]

permissions:
  contents: read

concurrency:
  group: unibud-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Show toolchain
        run: |
          node -v
          npm -v
          test -f package-lock.json
          test -f package.json

      - name: Install dependencies
        run: npm ci

      - name: Database policy tests
        run: npm run test:db-policy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Agent and Spark tests (pre-UI gate)
        run: npm run test:agents

      - name: Netlify-compatible production build
        run: npm run build:netlify
