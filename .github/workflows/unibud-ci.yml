name: UNIBUD Application Verification
# Verify the application without touching production.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Authentication invariant
        run: |
          npm run dev > /tmp/unibud-dev.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/__app-env > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run check:auth

      - name: Authentication policy tests
        run: npm run test:auth-policy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint agent and integration layer
        run: npx eslint src/lib/agents src/lib/spark src/lib/bud/server.ts src/lib/bud/spark.ts

      - name: Agent, Spark, and profile-role tests
        run: |
          npm run test:agents
          node --experimental-strip-types --test src/lib/unibud/profile-role.test.ts

      - name: Media payload parser tests
        run: npm run test:media

      - name: Academic session lifecycle tests
        run: npm run test:academic

      - name: Production-bundle build check
        run: npm run build:netlify
