name: UNIBUD Pre-UI Verification Gate
# Full application verification gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint agent and integration layer (pre-UI gate)
        run: npx eslint src/lib/agents src/lib/spark src/lib/bud/server.ts src/lib/bud/spark.ts

      # The existing UI/studio/routes lint baseline remains intentionally outside the pre-UI gate.
      # Full application linting will be restored when UI implementation begins.

      - name: Agent and Spark tests (pre-UI gate)
        run: npm run test:agents

      - name: Academic registry lint
        run: npx eslint src/lib/academic-registry scripts/academic-registry-schema.test.mjs src/routes/_app/academics.tsx

      - name: Academic registry contract tests
        run: npm run test:academic-registry

      - name: Academic registry isolated database migration tests
        run: npm run test:academic-registry-db

      - name: Production application build (without live database migration)
        run: npm run build:netlify

      # Full application lint baseline and staging smoke tests remain separate release gates.
