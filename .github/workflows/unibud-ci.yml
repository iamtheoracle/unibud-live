name: UNIBUD Pre-UI Verification Gate
# Full application verification gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      VITE_AUTH_ENABLED: "true"
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"
      NPM_CONFIG_PRODUCTION: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint agent and integration layer
        run: npx eslint src/lib/agents src/lib/spark src/lib/bud/server.ts src/lib/bud/spark.ts

      - name: Agent and Spark tests
        run: npm run test:agents

      - name: Production-mode Netlify build
        run: npm run build:netlify
