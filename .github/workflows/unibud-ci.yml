name: UNIBUD CI
# Full application verification gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint agent and integration layer (pre-UI gate)
        run: npx eslint src/lib/agents src/lib/spark src/lib/bud/server.ts src/lib/bud/spark.ts

      # The existing UI/studio/routes lint baseline remains intentionally outside the pre-UI gate.
      # Full application linting will be restored when UI implementation begins.

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
