name: UNIBUD Pre-UI Verification Gate
# Full application verification gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The checked-in lockfile is currently inconsistent with package.json (AJV 6/8 tree mismatch).
      # npm install resolves the existing baseline drift so the verification steps can run; regenerate
      # and commit package-lock.json in a dedicated dependency-maintenance change before release.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint agent and integration layer (pre-UI gate)
        run: npx eslint src/lib/agents src/lib/spark src/lib/bud/server.ts src/lib/bud/spark.ts

      - name: Lint modified marketplace and workspace UI
        run: npx eslint src/routes/_app/board.tsx src/routes/_app/concierge.tsx src/routes/_app/soulync.tsx src/routes/_app/market.tsx src/routes/_app/creator.tsx src/routes/_app/sell.tsx src/components/shell/side-menu.tsx src/lib/unibud/marketplace-domain.ts src/lib/unibud/marketplace-domain.test.ts src/lib/unibud/server.ts

      # The existing UI/studio/routes lint baseline remains intentionally outside the pre-UI gate.
      # Full application linting will be restored when UI implementation begins.

      - name: Agent and Spark tests (pre-UI gate)
        run: npm run test:agents

      - name: Marketplace domain tests
        run: npm run test:marketplace

      - name: Repository script tests
        run: npm test

      - name: Production-shaped Netlify build
        run: npm run build:netlify
        env:
          VITE_AUTH_ENABLED: "false"

      # Browser/UI interaction tests remain deferred until a browser runner is configured.
