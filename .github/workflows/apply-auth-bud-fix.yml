name: Apply auth and Bud fix
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guest-access-enforcement-2026-10-13
      - name: Patch trustedOrigins and login and workspace
        run: |
          python3 <<'PY'
          from pathlib import Path

          # trustedOrigins
          p = Path("src/lib/auth/server.ts")
          t = p.read_text()
          old = '''const trustedOrigins: string[] = explicitBaseURL
  ? [explicitBaseURL, ...LOCAL_DEV_ORIGINS]
  : [
      // Host wildcards (matched against Origin's host)
      ...previewAllowedHosts,
      // Full-origin wildcards (matched against Origin)
      ...previewAllowedHosts.flatMap((host) => [`https://${host}`, `http://${host}`]),
      ...LOCAL_DEV_ORIGINS,
    ];'''
          new = '''const trustedOrigins: string[] = [
  ...(explicitBaseURL ? [explicitBaseURL] : []),
  // Host wildcards (matched against Origin's host)
  ...previewAllowedHosts,
  // Full-origin wildcards (matched against Origin)
  ...previewAllowedHosts.flatMap((host) => [`https://${host}`, `http://${host}`]),
  ...LOCAL_DEV_ORIGINS,
];'''
          if old in t:
              p.write_text(t.replace(old, new))
              print("trustedOrigins ok")
          else:
              print("trustedOrigins skip")

          # login
          p = Path("src/routes/login.tsx")
          t = p.read_text()
          if "Account sign-in is not available on this deployment" not in t:
              old = '''        ) : (
          <p className="mt-6 text-sm text-muted-foreground">Sign-in is disabled.</p>
        )}

        <div className="my-8 flex items-center gap-3 text-xs tracking-wide text-muted-foreground uppercase">
          <span className="h-px flex-1 bg-border" />
          or email
          <span className="h-px flex-1 bg-border" />
        </div>

        <div className="mb-4 flex gap-2">'''
              new = '''        ) : (
          <div className="mt-6 space-y-3 rounded-2xl border border-border bg-secondary/40 p-4 text-sm text-muted-foreground">
            <p className="font-medium text-ink">Account sign-in is not available on this deployment.</p>
            <p>
              Authentication is turned off in this environment. You can still try Bud as a guest, or return when
              sign-in has been enabled for this site.
            </p>
            <div className="flex flex-wrap gap-2 pt-1">
              <a href="/bud" className="rounded-full bg-ink px-4 py-2 text-sm text-paper">
                Continue as Guest
              </a>
              <a href="/start" className="rounded-full bg-secondary px-4 py-2 text-sm text-ink">
                Back to welcome
              </a>
            </div>
          </div>
        )}

        {authEnabled ? (
        <>
        <div className="my-8 flex items-center gap-3 text-xs tracking-wide text-muted-foreground uppercase">
          <span className="h-px flex-1 bg-border" />
          or email
          <span className="h-px flex-1 bg-border" />
        </div>

        <div className="mb-4 flex gap-2">'''
              if old not in t:
                  raise SystemExit("login block missing")
              t = t.replace(old, new)
              old2 = '''          <p className="text-center text-[11px] text-muted-foreground">
            Verification goes to your email (Outlook or campus mail).
          </p>
        </form>
      </section>'''
              new2 = '''          <p className="text-center text-[11px] text-muted-foreground">
            Verification goes to your email (Outlook or campus mail).
          </p>
        </form>
        </>
        ) : null}
      </section>'''
              t = t.replace(old2, new2)
              p.write_text(t)
              print("login ok")
          else:
              print("login skip")

          # workspace
          p = Path("src/components/bud/workspace.tsx")
          t = p.read_text()
          t = t.replace(
              '{busy ? <p className="text-xs text-muted-foreground">Bud is thinking…</p> : null}',
              '{busy ? <p className="text-xs text-muted-foreground" aria-live="polite">Bud is typing…</p> : null}',
          )
          if "Bud could not reply right now" not in t:
              t = t.replace(
                  'onError: () => setPendingUser(null),',
                  '''onError: () => {
      setPendingUser(null);
      if (!user) {
        guest.appendAssistant("Bud could not reply right now. You can try again.");
      }
    },''',
              )
          old = '''onSuccess: async (r) => {
      setPrompt("");
      setAttachment(null);
      setPendingUser(null);
      setFreshChat(false);
      if (!user) {
        guest.appendAssistant(guestReplyText(r as { ok?: boolean; text?: string; error?: string }));
        return;
      }'''
          new = '''onSuccess: async (r) => {
      setAttachment(null);
      setFreshChat(false);
      if (!user) {
        guest.appendAssistant(guestReplyText(r as { ok?: boolean; text?: string; error?: string }));
        setPendingUser(null);
        setPrompt("");
        return;
      }
      setPendingUser(null);
      setPrompt("");'''
          if old in t:
              t = t.replace(old, new)
          p.write_text(t)
          print("workspace ok")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "fix: login honesty when auth off; Bud keeps question; Netlify trusted origins" || exit 0
          git pull --rebase origin fix/guest-access-enforcement-2026-10-13 || true
          git push origin HEAD:fix/guest-access-enforcement-2026-10-13
