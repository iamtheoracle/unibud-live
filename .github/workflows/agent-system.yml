name: Agent System Validation

on:
  push:
    paths:
      - 'src/lib/agents/**'
      - 'src/lib/spark/**'
      - '.github/workflows/agent-system.yml'
  pull_request:
    paths:
      - 'src/lib/agents/**'
      - 'src/lib/spark/**'
      - '.github/workflows/agent-system.yml'

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types --experimental-specifier-resolution=node --test src/lib/agents/organization.test.ts src/lib/agents/acceptance.test.ts src/lib/agents/activation.test.ts src/lib/agents/response-policy.test.ts src/lib/agents/runtime.test.ts src/lib/agents/content-context.test.ts src/lib/agents/context-access.test.ts src/lib/spark/runtime.test.ts src/lib/spark/orchestration/contract.test.ts
