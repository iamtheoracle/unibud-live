name: Agent System Validation

on:
  push:
    paths:
      - 'src/lib/agents/**'
      - 'src/lib/spark/**'
      - '.github/workflows/agent-system.yml'
  pull_request:
    paths:
      - 'src/lib/agents/**'
      - 'src/lib/spark/**'
      - '.github/workflows/agent-system.yml'

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test src/lib/agents/organization.test.ts
