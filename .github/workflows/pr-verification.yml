name: PR verification

on:
  pull_request:
    branches:
      - implementation/whole-product-foundation
  push:
    branches:
      - "fix/**"
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: unibud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d unibud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --include=dev

      - name: TypeScript
        run: npm run typecheck

      - name: Netlify production build
        run: npm run build:netlify

      - name: Authentication policy tests
        run: npm run test:auth-policy

      - name: Riff persistence and ownership tests
        run: npm run test:riff

      - name: PostgreSQL membership-revocation concurrency test
        env:
          RIFF_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/unibud_test
        run: npm run test:riff:postgres

      - name: Bud and agent tests
        run: npm run test:agents

      - name: Media access and storage tests
        run: npm run test:media

      - name: Academic session policy tests
        run: npm run test:academic
