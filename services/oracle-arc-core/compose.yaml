services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Keep Ollama private to the Compose network; do not publish port 11434.
  oracle-arc-core:
    build: .
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      ORACLE_ARC_API_KEY: ${ORACLE_ARC_API_KEY:?Set ORACLE_ARC_API_KEY in .env}
      ORACLE_ARC_OWNER_ID: ${ORACLE_ARC_OWNER_ID:?Set ORACLE_ARC_OWNER_ID in .env}
      ORACLE_ARC_MODEL: ${ORACLE_ARC_MODEL:-qwen2.5:7b}
      OLLAMA_BASE_URL: http://ollama:11434
      ORACLE_ARC_DATABASE: /data/oracle-arc.sqlite3
      ORACLE_ARC_ALLOWED_TOOLS: ${ORACLE_ARC_ALLOWED_TOOLS:-memory.search,memory.save,memory.delete}
    volumes:
      - oracle_arc_data:/data
volumes:
  ollama_data:
  oracle_arc_data:
