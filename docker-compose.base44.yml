services:
  postgres:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: unibud
      POSTGRES_PASSWORD: unibud
      POSTGRES_DB: unibud
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unibud -d unibud"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    image: node:22-slim
    restart: on-failure
    working_dir: /workspace
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    ports:
      - "3000:8080"
    environment:
      - DATABASE_URL=postgres://unibud:unibud@postgres:5432/unibud
      - VITE_AUTH_ENABLED=true
      - BETTER_AUTH_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - NODE_ENV=development
    env_file:
      - /run/base44/app.env
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund
        node scripts/migrate.mjs
        exec npm run dev
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  pgdata:
  node_modules:
